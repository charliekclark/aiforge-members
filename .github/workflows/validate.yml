name: Validate card

on:
  pull_request:
    paths:
      - 'cards/**'
      - 'photos/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every card
        run: node scripts/build.mjs --check
