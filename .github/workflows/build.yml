name: Build cards.json

# Runs after a pull request is merged into main. Builds cards.json from cards/
# so nobody has to edit a shared file (which is what causes merge conflicts).

on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'photos/**'
      - 'scripts/**'

permissions:
  contents: write

# One run at a time, so two quick merges don't race to push.
concurrency:
  group: build-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build cards.json
        run: node scripts/build.mjs
      - name: Commit cards.json
        run: |
          if git diff --quiet -- cards.json; then
            echo "cards.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git commit -m "Rebuild cards.json"
          git push
